[package]
name = "temporal-drasi"
version = "0.1.0"
edition = "2021"
publish = false

[workspace]
members = ["tests/plugin-fixture", "tests/other-plugin-fixture"]
default-members = ["."]
exclude = [
    ".upstream/drasi-core-029e8390bfc0a6e426ace96012593e743b068f65",
    ".upstream/drasi-core-198a2fbe0e9eb5f819d4ac5cce5622252d6ffe72",
    ".upstream/drasi-core-7bf4530999d24a435db70a6ac6e07c27b26253ac",
]

[patch."https://github.com/drasi-project/drasi-core"]
drasi-lib = { path = ".upstream/drasi-core-029e8390bfc0a6e426ace96012593e743b068f65/lib" }
drasi-core = { path = ".upstream/drasi-core-029e8390bfc0a6e426ace96012593e743b068f65/core" }
drasi-query-ast = { path = ".upstream/drasi-core-029e8390bfc0a6e426ace96012593e743b068f65/query-ast" }
drasi-query-cypher = { path = ".upstream/drasi-core-029e8390bfc0a6e426ace96012593e743b068f65/query-cypher" }
drasi-query-gql = { path = ".upstream/drasi-core-029e8390bfc0a6e426ace96012593e743b068f65/query-gql" }
drasi-functions-cypher = { path = ".upstream/drasi-core-029e8390bfc0a6e426ace96012593e743b068f65/functions-cypher" }
drasi-functions-gql = { path = ".upstream/drasi-core-029e8390bfc0a6e426ace96012593e743b068f65/functions-gql" }
drasi-host-sdk = { path = ".upstream/drasi-core-029e8390bfc0a6e426ace96012593e743b068f65/components/host-sdk" }
drasi-plugin-sdk = { path = ".upstream/drasi-core-029e8390bfc0a6e426ace96012593e743b068f65/components/plugin-sdk" }
drasi-state-store-redb = { path = ".upstream/drasi-core-029e8390bfc0a6e426ace96012593e743b068f65/components/state_stores/redb" }
drasi-wal-redb = { path = ".upstream/drasi-core-029e8390bfc0a6e426ace96012593e743b068f65/components/wals/redb" }
drasi-index-rocksdb = { path = ".upstream/drasi-core-029e8390bfc0a6e426ace96012593e743b068f65/components/indexes/rocksdb" }

[lib]
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
drasi-lib = { git = "https://github.com/drasi-project/drasi-core", rev = "9469f3e01ff22c4f0092c9900dfbd5051ceae545" }
drasi-core = { git = "https://github.com/drasi-project/drasi-core", rev = "9469f3e01ff22c4f0092c9900dfbd5051ceae545" }
drasi-query-cypher = { git = "https://github.com/drasi-project/drasi-core", rev = "9469f3e01ff22c4f0092c9900dfbd5051ceae545" }
drasi-query-gql = { git = "https://github.com/drasi-project/drasi-core", rev = "9469f3e01ff22c4f0092c9900dfbd5051ceae545" }
drasi-functions-cypher = { git = "https://github.com/drasi-project/drasi-core", rev = "9469f3e01ff22c4f0092c9900dfbd5051ceae545" }
drasi-functions-gql = { git = "https://github.com/drasi-project/drasi-core", rev = "9469f3e01ff22c4f0092c9900dfbd5051ceae545" }
drasi-host-sdk = { git = "https://github.com/drasi-project/drasi-core", rev = "9469f3e01ff22c4f0092c9900dfbd5051ceae545", features = ["registry"] }
drasi-plugin-sdk = { git = "https://github.com/drasi-project/drasi-core", rev = "9469f3e01ff22c4f0092c9900dfbd5051ceae545" }
drasi-state-store-redb = { git = "https://github.com/drasi-project/drasi-core", rev = "9469f3e01ff22c4f0092c9900dfbd5051ceae545" }
drasi-wal-redb = { git = "https://github.com/drasi-project/drasi-core", rev = "9469f3e01ff22c4f0092c9900dfbd5051ceae545" }
drasi-index-rocksdb = { git = "https://github.com/drasi-project/drasi-core", rev = "9469f3e01ff22c4f0092c9900dfbd5051ceae545" }
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
async-trait = "0.1"
uuid = { version = "1", features = ["v4", "serde"] }
sha2 = "0.10"
anyhow = "1"
bytes = "1"
chrono = "0.4"
fs2 = "0.4"
libloading = "0.8"
futures-util = "0.3"

[dev-dependencies]
temporal-drasi-test-plugin = { path = "tests/plugin-fixture" }
temporal-drasi-other-test-plugin = { path = "tests/other-plugin-fixture" }

[profile.dev]
debug = 0
strip = "none"

[profile.release]
strip = "none"
